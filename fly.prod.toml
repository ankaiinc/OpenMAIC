# Dedicated production classroom service. Provision the app and managed
# Postgres/Tigris resources separately; this file intentionally contains no
# credentials and no persistent Fly volume.
app = "pl-classroom-prod"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  HOSTNAME = "0.0.0.0"
  PORT = "3000"
  NODE_ENV = "production"
  NEXT_PUBLIC_PERSISTENCE = "1"
  OPENMAIC_PUBLIC_URL = "https://classroom.pragmaticleaders.io"
  PL_APP_BASE_URL = "https://app.pragmaticleaders.io"
  NEXT_PUBLIC_PL_APP_BASE_URL = "https://app.pragmaticleaders.io"
  ASSET_COLLECTION_ENABLED = "1"
  ASSET_COLLECTION_INTERVAL_MS = "900000"
  ASSET_COLLECTION_GRACE_MS = "86400000"
  ASSET_BYTE_EGRESS = "redirect"
  DEFAULT_MODEL = "openai:gpt-5.5"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 30

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
